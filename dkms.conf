PACKAGE_NAME="hptiop"
PACKAGE_VERSION="2.0.0"

BUILT_MODULE_NAME[0]="hptiop"
BUILT_MODULE_LOCATION[0]="src/"
# updates/ is searched before the in-tree kernel/ directory by depmod, so this
# module takes precedence over the distribution's hptiop without touching it.
DEST_MODULE_LOCATION[0]="/updates/dkms"

MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/src HPTIOP_VERSION=${PACKAGE_VERSION} modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/src clean"

# Kernels older than 6.8 are refused. Only Ubuntu 24.04 (6.8) and Ubuntu 26.04
# (7.0) are supported; other newer kernels are attempted but untested.
BUILD_EXCLUSIVE_KERNEL="^(6\.([89]|[1-9][0-9])|[7-9]|[1-9][0-9]+)\."

AUTOINSTALL="yes"
